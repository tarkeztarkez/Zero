[package]
name = "zero-server"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
ammonia = "4.2.0"
anyhow = "1.0.104"
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
hex = "0.4.3"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }
mail-parser = "0.11.9"
once_cell = "1.21.4"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form", "query", "http2"] }
rustls = "0.23.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }
thiserror = "2.0.21"
time = "0.3"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = "0.26.5"
tower-http = { version = "0.7.1", features = ["fs", "trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
urlencoding = "2.1.3"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
webpki-roots = "1.0.9"
